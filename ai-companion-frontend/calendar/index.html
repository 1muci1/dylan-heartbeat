<!doctype html>
<html lang="zh-CN" data-companion-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="我们的小窝日历">
  <title>日历 · 我们的小窝</title>
  <link rel="stylesheet" href="../theme/theme.css">
  <link rel="stylesheet" href="../theme/app-nav.css">
  <link rel="stylesheet" href="./calendar.css">
</head>
<body class="companion-themed-page calendar-page">
  <main class="calendar-shell">
    <header class="calendar-header">
      <a class="calendar-back" href="/index.html" aria-label="返回小窝">‹</a>
      <div><p>OUR LITTLE DAY</p><h1>日历</h1></div>
      <span class="calendar-header__mark">月光</span>
    </header>
    <section class="calendar-together companion-themed-surface" aria-label="相遇日信息">
      <div><small>TOGETHER SINCE</small><strong>2026-07-01</strong><span>相遇日</span></div>
      <div class="calendar-together__days"><small>今天是一起生活</small><strong>第 <b data-calendar-days>24</b> 天</strong></div>
    </section>
    <section class="calendar-card companion-themed-surface" aria-labelledby="calendar-month-title">
      <div class="calendar-card__heading"><button type="button" data-calendar-prev aria-label="上个月">‹</button><h2 id="calendar-month-title" data-calendar-month>2026年7月</h2><button type="button" data-calendar-next aria-label="下个月">›</button></div>
      <div class="calendar-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calendar-grid" data-calendar-grid role="grid" aria-label="日期网格"></div>
    </section>
    <section class="calendar-events companion-themed-surface" aria-labelledby="calendar-events-title">
      <div><small>IMPORTANT DATES</small><h2 id="calendar-events-title">重要日期</h2></div>
      <div class="calendar-event"><span>♡</span><div><strong>相遇日</strong><small>2026年07月01日</small></div><b>一起生活</b></div>
    </section>
  </main>
  <nav class="app-tab-bar" aria-label="主导航">
    <a href="/index.html"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg><span>小窝</span></a>
    <a href="/game/"><svg viewBox="0 0 24 24"><path d="M8 9h8a5 5 0 0 1 4.7 6.7l-.5 1.4a2.5 2.5 0 0 1-4.1 1l-1.3-1.2H9.2l-1.3 1.2a2.5 2.5 0 0 1-4.1-1l-.5-1.4A5 5 0 0 1 8 9Z"></path><path d="M8 12v3M6.5 13.5h3M16 13h.01M18 15h.01"></path></svg><span>游戏</span></a>
    <a class="app-tab-bar__chat" href="/chat.html" aria-label="和沉聊天"><span class="app-tab-bar__chat-icon"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M20 11.5a8 8 0 0 1-8.5 8A8 8 0 0 1 4 12a8 8 0 0 1 8-8h.5a8 8 0 0 1 7.5 7.5Z"></path><path d="m7 20-3 1 1-3"></path></svg></span><span>聊天</span></a>
    <a href="/collaboration/"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 17V9M10 17V9M14 17V9M18 17V9M3 9h18L12 3Z"></path></svg><span>议事厅</span></a>
    <a href="/space/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4L10 6a8 8 0 0 0-1.8 1l-2.4-1-2 3.4L5.8 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8-1l2.4 1-2-3.4a7 7 0 0 0 .1-1Z"></path></svg><span>设置</span></a>
  </nav>
  <script src="./calendar.js"></script>
</body>
</html>
