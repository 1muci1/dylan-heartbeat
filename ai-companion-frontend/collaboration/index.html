<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3fb">
  <meta name="description" content="沉的小世界 · Collaboration Room">
  <link rel="stylesheet" href="collaboration.css">
  <link rel="stylesheet" href="/shared/provider-config-panel.css">
  <title>圆桌 · Collaboration Room</title>
</head>
<body>
  <main class="collaboration-shell">
    <header class="page-header">
      <div>
        <p>COLLABORATION ROOM</p>
        <h1>圆桌</h1>
      </div>
      <a href="/home/">返回小窝</a>
    </header>

    <section class="intro-card" aria-labelledby="intro-title">
      <div class="roundtable-mark" aria-hidden="true">
        <span>沉</span>
        <i></i>
        <span>GPT</span>
      </div>
      <div>
        <p class="eyebrow">独立讨论空间</p>
        <h2 id="intro-title">把一个问题放到桌面中央</h2>
        <p>每个房间拥有独立的主题、参与者、消息和总结，并通过 Companion Gateway 发起真实讨论。</p>
      </div>
    </section>

    <section class="create-card" aria-labelledby="create-title">
      <div class="section-heading">
        <div>
          <p>NEW ROOM</p>
          <h2 id="create-title">创建讨论房间</h2>
        </div>
        <span>GATEWAY</span>
      </div>

      <form data-room-form>
        <label for="discussion-topic">讨论主题</label>
        <textarea
          id="discussion-topic"
          name="topic"
          rows="3"
          maxlength="240"
          placeholder="例如：怎样让沉的小世界更有陪伴感？"
          required
        ></textarea>

        <fieldset>
          <legend>参与 Agent</legend>
          <div class="agent-card">
            <label class="agent-option agent-option--chen">
              <input type="checkbox" name="agents" value="chen" checked>
              <span class="agent-avatar">沉</span>
              <span><strong>chen</strong><small>AI Companion</small></span>
            </label>
            <button type="button" data-configure-agent="chen">配置此 AI</button>
          </div>
          <div class="agent-card">
            <label class="agent-option agent-option--gpt">
              <input type="checkbox" name="agents" value="chatgpt" checked>
              <span class="agent-avatar">G</span>
              <span><strong>chatgpt</strong><small>协作 Agent</small></span>
            </label>
            <button type="button" data-configure-agent="chatgpt">配置此 AI</button>
          </div>
        </fieldset>

        <button class="primary-button" type="submit">创建房间</button>
        <p class="form-status" data-form-status aria-live="polite"></p>
      </form>
    </section>

    <section class="room-card" data-room-view aria-labelledby="room-title" hidden>
      <header class="room-header">
        <div>
          <p>ROOM <span data-room-id></span></p>
          <h2 id="room-title" data-room-topic></h2>
        </div>
        <div class="participant-stack" data-participants aria-label="房间参与者"></div>
      </header>

      <div class="room-context">
        <span>独立上下文</span>
        <span>内存 Session</span>
        <span>Gateway API</span>
      </div>

      <div class="message-list" data-message-list aria-live="polite"></div>

      <div class="empty-room" data-empty-room>
        <span aria-hidden="true">◯</span>
        <p>房间已经准备好，开始一轮讨论吧。</p>
      </div>

      <div class="room-actions">
        <button class="secondary-button" type="button" data-run-discussion>开始讨论</button>
        <button class="primary-button" type="button" data-generate-summary disabled>查看总结</button>
      </div>
      <p class="room-status" data-room-status aria-live="polite"></p>

      <aside class="summary-card" data-summary-card hidden>
        <p>ROOM SUMMARY</p>
        <h3>讨论总结</h3>
        <div data-summary-text></div>
      </aside>
    </section>
  </main>

  <dialog class="provider-config-dialog" data-agent-provider-dialog>
    <form data-agent-provider-form data-provider-config-form>
      <header><div><p>AI PROVIDER</p><h2 data-provider-panel-title>配置 AI</h2></div><button type="button" data-provider-panel-close aria-label="关闭">×</button></header>
      <label>配置来源
        <select name="source"><option value="global">使用全局模型配置</option><option value="custom">使用单独 Provider 配置</option></select>
      </label>
      <label>Provider 类型
        <select name="type" data-provider-custom><option value="dylan">Dylan Gateway</option><option value="gateway">OpenAI-compatible Gateway</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic-compatible</option></select>
      </label>
      <label>API Base URL<input name="baseUrl" type="url" inputmode="url" placeholder="https://gateway.example.com" data-provider-custom></label>
      <label>API Path<input name="endpoint" type="text" placeholder="/v1/chat/completions" data-provider-custom></label>
      <label>API Key<span class="provider-config-secret"><input name="token" type="password" autocomplete="new-password" data-provider-custom><button type="button" data-provider-panel-token>显示</button></span></label>
      <label>Model<input name="model" type="text" autocomplete="off" placeholder="claude-opus-4-6" data-provider-custom></label>
      <label class="provider-config-enabled"><span>支持图片理解</span><input name="supportsImages" type="checkbox" data-provider-custom></label>
      <label class="provider-config-enabled"><span>启用此 AI</span><input name="enabled" type="checkbox" data-provider-custom></label>
      <p data-agent-provider-status data-provider-panel-status role="status"></p>
      <div class="provider-config-actions"><button type="button" data-provider-panel-close>取消</button><button type="submit">保存</button></div>
    </form>
  </dialog>

  <script src="/assets/js/data.js"></script>
  <script src="/shared/provider-config-panel.js"></script>
  <script src="collaboration-provider-store.js"></script>
  <script src="collaboration.js"></script>
</body>
</html>
