<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#251b31">
  <meta name="description" content="沉的小世界正在载入">
  <link rel="preload" as="document" href="/index.html">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/common.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Songti SC", "Noto Serif SC", serif;
      color: #f3edf8;
      background:
        radial-gradient(circle at 50% 28%, rgba(184,153,210,.26), transparent 32%),
        linear-gradient(180deg, #251b31, #17121f);
    }
    body.is-entering .landing-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    body.is-entering .landing-card::after {
      opacity: 1;
    }
    main {
      width: min(92vw, 520px);
      padding: 28px;
      border: 1px solid rgba(224,202,239,.16);
      border-radius: 28px;
      background: rgba(39, 28, 50, .78);
      box-shadow: 0 20px 55px rgba(13, 8, 20, .3);
      text-align: center;
      backdrop-filter: blur(18px);
    }
    .landing-card {
      position: relative;
      overflow: hidden;
      opacity: .96;
      transform: translateY(10px) scale(.98);
      transition: opacity .42s ease, transform .55s cubic-bezier(.2,.9,.2,1);
    }
    .landing-card::before,
    .landing-card::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
    }
    .landing-card::before {
      inset: -18% 12% auto;
      height: 160px;
      background: radial-gradient(circle, rgba(184,153,210,.2), transparent 72%);
      filter: blur(6px);
    }
    .landing-card::after {
      left: 50%;
      bottom: 24px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(184,153,210,.18);
      border-top-color: rgba(184,153,210,.92);
      opacity: .82;
      transform: translateX(-50%);
      animation: landing-spin 1s linear infinite;
    }
    p { margin: 0; color: #b9abc4; letter-spacing: .24em; font-size: .72rem; }
    h1 { margin: 12px 0 10px; font-size: clamp(2rem, 7vw, 3rem); }
    a { color: #b899d2; }
    .loading {
      margin-top: 18px;
      color: #d7c9e3;
      font-size: .95rem;
      line-height: 1.8;
    }
    .loading strong { color: #ffffff; }
    .loading em {
      display: inline-block;
      margin-inline-start: 6px;
      font-style: normal;
      letter-spacing: .2em;
      animation: landing-pulse 1.2s ease-in-out infinite;
    }
    .loading__bars {
      display: inline-flex;
      gap: 6px;
      margin-top: 14px;
    }
    .loading__bars span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(184,153,210,.52);
      animation: landing-dot 1.2s ease-in-out infinite;
    }
    .loading__bars span:nth-child(2) { animation-delay: .12s; }
    .loading__bars span:nth-child(3) { animation-delay: .24s; }
    @keyframes landing-spin {
      to { transform: translateX(-50%) rotate(360deg); }
    }
    @keyframes landing-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: .45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    @keyframes landing-pulse {
      0%, 100% { opacity: .58; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .landing-card,
      .landing-card::after,
      .loading em,
      .loading__bars span {
        animation: none;
        transition: none;
      }
    }
  </style>
  <title>沉的小世界</title>
</head>
<body>
  <main class="landing-card" aria-labelledby="landing-title">
    <p>CHEN'S LITTLE WORLD</p>
    <h1 id="landing-title">正在进入沉的小世界</h1>
    <div class="loading">
      <strong>AppConfig</strong> 已就绪，正在引导到 <a href="/index.html">Home</a> <em>…</em>
      <div class="loading__bars" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </main>
  <script src="/assets/js/data.js"></script>
  <script>
    window.AppConfig?.getProviderConfig?.();
    document.body.classList.add("is-entering");
    window.setTimeout(() => window.location.replace("/index.html"), 720);
  </script>
</body>
</html>
