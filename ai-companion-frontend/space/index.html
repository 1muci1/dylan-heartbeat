<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="沉的小世界 · Space Studio">
  <meta name="xinban-build" content="v70-p4b-theme-asset-experience">
  <link rel="stylesheet" href="../theme/theme.css">
  <link rel="stylesheet" href="../theme/app-nav.css">
  <link rel="stylesheet" href="../avatar/avatar.css">
  <link rel="stylesheet" href="space.css">
  <link rel="stylesheet" href="/assets/css/theme.css?v=v70-p4b">
  <script src="/assets/js/theme-store.js?v=v70-p4b"></script>
  <title>沉的小世界 · Space Studio</title>
</head>
<body class="companion-themed-page space-page">
  <main class="space-shell">
    <header class="page-header">
      <div>
        <p>COMPANION SPACE</p>
        <h1>沉的小世界</h1>
      </div>
      <span data-space-mode>紫月夜</span>
    </header>

    <section class="preview-card companion-themed-surface" aria-labelledby="preview-title">
      <div class="moon" aria-hidden="true"></div>
      <div class="avatar-stage" data-avatar-stage></div>
      <div>
        <p class="eyebrow">SPACE PREVIEW</p>
        <h2 id="preview-title">欢迎回来</h2>
        <p>这里的主题、头像、字体和背景只属于当前页面会话。</p>
      </div>
    </section>

    <section class="studio-card companion-themed-surface" aria-labelledby="studio-title">
      <header class="section-heading">
        <div>
          <p>SPACE STUDIO</p>
          <h2 id="studio-title">空间设置</h2>
        </div>
        <button type="button" data-reset-space>恢复默认</button>
      </header>

      <div class="settings-grid">
        <fieldset>
          <legend>主题模式</legend>
          <div class="segmented" data-theme-modes>
            <button type="button" data-theme-mode="auto">跟随系统</button>
            <button type="button" data-theme-mode="day">日间</button>
            <button type="button" data-theme-mode="night">深夜</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>头像</legend>
          <label class="file-control">
            <span>选择头像图片</span>
            <input type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" data-avatar-upload>
          </label>
          <label>
            缩放
            <input type="range" min="1" max="3" step=".05" value="1" data-avatar-zoom>
          </label>
          <div class="crop-grid">
            <label>水平<input type="range" min="0" max="100" value="50" data-avatar-x></label>
            <label>垂直<input type="range" min="0" max="100" value="50" data-avatar-y></label>
          </div>
          <label>
            边框
            <select data-avatar-border>
              <option value="moon">月光环</option>
              <option value="soft">柔和</option>
              <option value="minimal">极简</option>
              <option value="none">无边框</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>背景</legend>
          <label>
            图片 URL
            <input type="url" placeholder="https://… 或 /assets/…" data-background-url>
          </label>
          <div class="button-row">
            <button type="button" data-apply-background>应用背景</button>
            <button type="button" data-clear-background>清除背景</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>字体加载</legend>
          <label>
            字体名称
            <input type="text" maxlength="80" placeholder="Companion Serif" data-font-family>
          </label>
          <label>
            字体 URL
            <input type="url" placeholder="/assets/fonts/companion.woff2" data-font-url>
          </label>
          <button type="button" data-load-font>加载并应用</button>
        </fieldset>
      </div>

      <p class="space-status" data-space-status aria-live="polite"></p>
    </section>
  </main>
  <nav class="app-tab-bar" aria-label="主导航">
    <a href="/index.html"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg><span>小窝</span></a>
    <a href="/game/"><svg viewBox="0 0 24 24"><path d="M8 9h8a5 5 0 0 1 4.7 6.7l-.5 1.4a2.5 2.5 0 0 1-4.1 1l-1.3-1.2H9.2l-1.3 1.2a2.5 2.5 0 0 1-4.1-1l-.5-1.4A5 5 0 0 1 8 9Z"></path></svg><span>游戏</span></a>
    <a class="app-tab-bar__chat" href="/chat.html"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8.5 8A8 8 0 0 1 4 12a8 8 0 0 1 8-8h.5a8 8 0 0 1 7.5 7.5Z"></path><path d="m7 20-3 1 1-3"></path></svg><span>聊天</span></a>
    <a href="/collaboration/"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 17V9M10 17V9M14 17V9M18 17V9M3 9h18L12 3Z"></path></svg><span>议事厅</span></a>
    <a href="/space/" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4L10 6a8 8 0 0 0-1.8 1l-2.4-1-2 3.4L5.8 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8 1l.4 3h4l.4-3a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"></path></svg><span>设置</span></a>
  </nav>

  <script src="theme-adapter.js?v=v70-p4b"></script>
  <script src="../storage/user-preference-store.js"></script>
  <script src="../avatar/avatar-studio.js"></script>
  <script src="presets.js"></script>
  <script src="space-profile.js"></script>
  <script src="space.js"></script>
</body>
</html>
