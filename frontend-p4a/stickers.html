<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6fb"><link rel="stylesheet" href="assets/css/common.css"><link rel="stylesheet" href="assets/css/stickers.css"><title>心伴 · Sticker 管理</title></head>
<body data-page="stickers"><main class="sticker-manager"><header><a href="chat.html" aria-label="返回聊天">‹</a><div><h1>Sticker</h1><p>上传、标注与整理表情</p></div></header>
<form class="sticker-upload"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" required><input name="label" maxlength="100" placeholder="名称，例如：开心地挥手"><input name="tags" maxlength="500" placeholder="标签，用空格分隔"><button>上传 Sticker</button><p class="manager-status" role="status"></p></form>
<div class="manager-tools"><input type="search" placeholder="搜索名称或标签"><select><option value="active">使用中</option><option value="deleted">已删除</option></select></div><section class="manager-grid"></section></main>
<script src="assets/js/data.js"></script><script src="assets/js/provider.js"></script><script src="assets/js/common.js"></script><script src="assets/js/stickers.js"></script><script src="assets/js/sticker-manager.js"></script></body></html>
