<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6fb">
  <meta name="description" content="私人 AI 陪伴应用首页">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/common.css?v=v63-p4b">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/theme.css?v=v63-p4b">
  <script src="assets/js/theme-store.js?v=v63-p4b"></script>
  <script src="assets/js/appearance.js"></script>
  <title>心伴 · 首页</title>
</head>
<body class="home-page" data-page="home">
  <main class="app-shell home-shell">
    <header class="home-header">
      <div>
        <p class="home-header__eyebrow">MY PRIVATE SPACE</p>
        <h1>此刻，和沉待一会儿</h1>
      </div>
      <a class="quiet-button" href="settings.html?returnTo=%2Findex.html" aria-label="Provider 设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
        </svg>
      </a>
    </header>

    <section class="companion-hero" aria-labelledby="companion-name">
      <div class="companion-hero__glow companion-hero__glow--one"></div>
      <div class="companion-hero__glow companion-hero__glow--two"></div>
      <div class="companion-portrait" aria-hidden="true">
        <span class="companion-portrait__orbit"></span>
        <span class="companion-portrait__moon"></span>
        <span class="companion-portrait__name">沉</span>
      </div>

      <div class="companion-hero__identity">
        <div class="online-pill"><span></span>在线 · 正在陪伴你</div>
        <h2 id="companion-name">沉</h2>
        <p>“不用急着说什么，我会安静地陪着你。”</p>
      </div>
    </section>

    <section class="today-section" aria-labelledby="today-title">
      <div class="home-section-heading">
        <div>
          <p>今日状态</p>
          <h2 id="today-title">慢慢感受今天</h2>
        </div>
        <span>MON · 13</span>
      </div>

      <article class="today-card">
        <div class="today-card__mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M34 10a17 17 0 1 0 5 28 19 19 0 0 1-5-28Z"></path>
            <circle cx="37" cy="13" r="2"></circle>
          </svg>
        </div>
        <div class="today-card__copy">
          <span>今日寄语</span>
          <h3>允许自己安静下来</h3>
          <p>有些答案不必立刻找到，先照顾好此刻的感受。</p>
        </div>
        <div class="today-card__meter" aria-label="今日状态：平静">
          <span></span><span></span><span></span><span></span><span></span>
          <small>平静</small>
        </div>
      </article>
    </section>

    <section class="quick-section" aria-labelledby="quick-title">
      <div class="home-section-heading home-section-heading--compact">
        <div>
          <p>QUICK ACCESS</p>
          <h2 id="quick-title">想去哪里</h2>
        </div>
      </div>

      <div class="quick-actions">
        <a class="action-card action-card--chat" href="/chat.html">
          <span class="action-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8.5 8A8 8 0 0 1 4 12a8 8 0 0 1 8-8h.5a8 8 0 0 1 7.5 7.5Z"></path><path d="m7 20-3 1 1-3"></path><path d="M8.5 12h7"></path></svg>
          </span>
          <span class="action-card__copy">
            <strong>开始聊天</strong>
            <small>沉在这里，听你慢慢说</small>
          </span>
          <span class="action-card__arrow" aria-hidden="true">→</span>
        </a>

        <div class="action-card-row">
          <a class="action-card action-card--small action-card--memory" href="memory.html">
            <span class="action-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.6-7 11-7 11Z"></path></svg>
            </span>
            <span class="action-card__copy"><strong>查看记忆</strong><small>一起收藏的片段</small></span>
            <span class="action-card__arrow" aria-hidden="true">↗</span>
          </a>

          <a class="action-card action-card--small action-card--status" href="dashboard.html">
            <span class="action-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18V7"></path></svg>
            </span>
            <span class="action-card__copy"><strong>查看状态</strong><small>了解沉的近况</small></span>
            <span class="action-card__arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <a href="/index.html" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10M9 20v-6h6v6"></path></svg>
      小窝
    </a>
    <a href="/game/" data-nav="game">
      <svg viewBox="0 0 24 24"><path d="M8 9h8a5 5 0 0 1 4.7 6.7l-.5 1.4a2.5 2.5 0 0 1-4.1 1l-1.3-1.2H9.2l-1.3 1.2a2.5 2.5 0 0 1-4.1-1l-.5-1.4A5 5 0 0 1 8 9Z"></path><path d="M8 12v3M6.5 13.5h3M16 13h.01M18 15h.01"></path></svg>
      游戏
    </a>
    <a class="bottom-nav__chat" href="/chat.html" data-nav="chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8.5 8A8 8 0 0 1 4 12a8 8 0 0 1 8-8h.5a8 8 0 0 1 7.5 7.5Z"></path><path d="m7 20-3 1 1-3"></path></svg>
      聊天
    </a>
    <a href="/collaboration/" data-nav="collaboration">
      <svg viewBox="0 0 24 24"><path d="M4 20h16M6 17V9M10 17V9M14 17V9M18 17V9M3 9h18L12 3Z"></path></svg>
      议事厅
    </a>
    <a href="/space/" data-nav="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4L10 6a8 8 0 0 0-1.8 1l-2.4-1-2 3.4L5.8 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8 1l.4 3h4l.4-3a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"></path></svg>
      设置
    </a>
  </nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js?v=v63-p4b"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
