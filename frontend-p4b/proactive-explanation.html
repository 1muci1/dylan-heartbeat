<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6fb">
  <meta name="description" content="心伴主动互动解释">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/common.css?v=v58-p4b">
  <link rel="stylesheet" href="assets/css/proactive-explanation.css">
  <link rel="stylesheet" href="assets/css/theme.css?v=v58-p4b">
  <script src="assets/js/theme-store.js?v=v58-p4b"></script>
  <title>心伴 · 主动互动解释</title>
</head>
<body class="explanation-page" data-page="dashboard">
  <main class="app-shell explanation-shell">
    <header class="explanation-header">
      <a class="explanation-back" href="dashboard.html" aria-label="返回陪伴状态">‹</a>
      <div><p>PROACTIVE EXPLANATION</p><h1>主动互动解释</h1></div>
      <span class="explanation-readonly">只读</span>
    </header>

    <p class="explanation-intro">输入 Delivery ID，查看已经存在且可以证明的结构化事实。查询不会改变任何状态。</p>

    <form class="explanation-query" data-explanation-form>
      <label for="delivery-id">Delivery ID</label>
      <div>
        <input id="delivery-id" name="deliveryId" type="text" minlength="1" maxlength="200" autocomplete="off" spellcheck="false" required>
        <button type="submit" data-explanation-submit>查询解释</button>
      </div>
      <p>需要使用设置页中已有的 Gateway 地址和 Bearer Token。</p>
    </form>

    <section class="explanation-notice" data-explanation-notice role="status" aria-live="polite">
      <h2 data-explanation-notice-title>等待查询</h2>
      <p data-explanation-notice-message>页面不会自动加载或轮询。</p>
      <a href="settings.html?returnTo=%2Ffrontend-p4b%2Fproactive-explanation.html" data-explanation-settings hidden>前往连接设置</a>
    </section>

    <section class="explanation-result" data-explanation-result aria-live="polite" hidden>
      <header class="explanation-summary">
        <p>DELIVERY SUMMARY</p>
        <h2 data-explanation-summary></h2>
        <span data-explanation-id></span>
      </header>
      <div class="explanation-sections" data-explanation-sections></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <a href="/home/" data-nav="home"><span aria-hidden="true">⌂</span>首页</a>
    <a href="/chat.html" data-nav="chat"><span aria-hidden="true">◌</span>聊天</a>
    <a href="dashboard.html" data-nav="dashboard"><span aria-hidden="true">◷</span>状态</a>
  </nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js?v=v58-p4b"></script>
  <script src="assets/js/proactive-explanation.js"></script>
</body>
</html>
