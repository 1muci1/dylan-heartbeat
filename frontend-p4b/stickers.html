<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6fb"><link rel="stylesheet" href="assets/css/common.css?v=v59-p4b"><link rel="stylesheet" href="assets/css/stickers.css?v=v59-p4b"><link rel="stylesheet" href="assets/css/theme.css?v=v59-p4b"><script src="assets/js/theme-store.js?v=v59-p4b"></script><title>心伴 · Sticker 管理</title></head>
<body data-page="stickers"><main class="sticker-manager"><header><a href="chat.html" aria-label="返回聊天">‹</a><div><h1>Sticker</h1><p>上传、标注与整理表情</p></div></header>
<section class="sticker-import"><h2>导入表情包文件</h2><p>支持 DOCX、TXT、Markdown、JSON、CSV、图片和 ZIP 图片包。先识别预览，确认后才会导入。</p><label>选择表情包文件<input type="file" accept=".docx,.txt,.md,.json,.csv,.zip,.png,.jpg,.jpeg,.webp,.gif,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,application/json,text/csv,application/zip,image/png,image/jpeg,image/webp,image/gif"></label><button type="button" data-sticker-import-preview>识别文件</button><div class="import-preview" hidden><div class="import-preview-grid"></div><button type="button" data-sticker-import-confirm>导入表情包</button></div><p class="import-status" role="status"></p></section>
<details class="single-sticker"><summary>单张补充</summary>
<form class="sticker-upload"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" required><input name="label" maxlength="100" placeholder="名称，例如：开心地挥手"><input name="tags" maxlength="500" placeholder="标签，用空格分隔"><button>上传 Sticker</button><p class="manager-status" role="status"></p></form>
</details>
<div class="manager-tools"><input type="search" placeholder="搜索名称或标签"><select><option value="active">使用中</option><option value="deleted">已删除</option></select></div><section class="manager-grid"></section></main>
<script src="assets/js/data.js"></script><script src="assets/js/provider.js"></script><script src="assets/js/common.js?v=v59-p4b"></script><script src="assets/js/stickers.js?v=v59-p4b"></script><script src="assets/js/sticker-manager.js?v=v59-p4b"></script></body></html>
