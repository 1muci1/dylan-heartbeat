<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4fb"><title>心伴 · 主题广场</title>
  <link rel="stylesheet" href="assets/css/common.css?v=v76-p4b">
  <link rel="stylesheet" href="assets/css/theme.css?v=v76-p4b">
  <link rel="stylesheet" href="assets/css/theme-community.css?v=v76-p4b">
  <script src="assets/js/theme-store.js?v=v76-p4b"></script>
  <script src="assets/js/theme-gateway.js?v=v76-p4b"></script>
  <script src="assets/js/common.js?v=v76-p4b"></script>
  <script src="assets/js/data.js"></script>
</head>
<body class="theme-community-page" data-page="settings">
<main class="app-shell theme-community-shell">
  <header class="theme-community-header"><a href="theme-center.html" aria-label="返回主题中心">‹</a><div><p class="eyebrow">THEME COMMUNITY · V75</p><h1>主题广场</h1><p>发现大家公开的小世界，先预览，再复制到自己的主题。</p></div><a href="theme-center.html">我的主题</a></header>
  <section class="theme-community-filters" aria-label="公开主题筛选">
    <label>搜索公开主题<input type="search" data-community-search placeholder="名称、简介、标签、氛围、风格、色彩"></label>
    <label>标签<select data-community-tag><option value="">全部标签</option></select></label>
    <label>排序<select data-community-sort><option value="latest">最新</option><option value="popular">热门</option><option value="mostUsed">使用最多</option></select></label>
  </section>
  <p class="theme-community-status" role="status" data-community-status>正在读取公开主题…</p>
  <section class="theme-community-grid" data-community-grid aria-label="公开主题列表"></section>
  <button class="theme-community-more" type="button" data-community-more hidden>加载更多</button>
  <section class="theme-community-detail" data-community-detail hidden aria-labelledby="community-detail-title"></section>
</main>
<dialog class="theme-community-preview" data-community-preview aria-labelledby="community-preview-title">
  <div class="theme-community-preview__shell">
    <header><div><p class="eyebrow">隔离预览</p><h2 id="community-preview-title" data-community-preview-title>主题预览</h2></div><button type="button" data-community-preview-close aria-label="关闭预览">×</button></header>
    <nav aria-label="预览页面"><button type="button" data-community-preview-page="home" aria-pressed="true">首页</button><button type="button" data-community-preview-page="chat" aria-pressed="false">聊天</button><button type="button" data-community-preview-page="space" aria-pressed="false">空间</button><button type="button" data-community-preview-page="collaboration" aria-pressed="false">议事厅</button></nav>
    <div class="theme-community-preview__stage" data-community-preview-stage data-preview-page="home">
      <section class="community-scene" data-community-scene="home"><div class="scene-header">主题首页</div><div class="scene-hero">今天也慢慢来</div><div class="scene-card">公开主题预览</div></section>
      <section class="community-scene" data-community-scene="chat" hidden><div class="scene-header">聊天预览</div><div class="scene-chat"><p>今天过得怎么样？</p><p>我在这里。</p></div><div class="scene-input">写点什么…</div></section>
      <section class="community-scene" data-community-scene="space" hidden><div class="scene-header">空间预览</div><div class="scene-hero">窗边的下午</div><div class="scene-card">一起布置的小窝</div></section>
      <section class="community-scene" data-community-scene="collaboration" hidden><div class="scene-header">议事厅预览</div><div class="scene-card">一起讨论今天的话题</div></section>
    </div>
    <footer><button type="button" data-community-preview-previous>上一页</button><p>预览不会增加浏览量或修改当前主题</p><button type="button" data-community-preview-next>下一页</button><button type="button" data-community-preview-copy>复制到我的主题</button></footer>
  </div>
</dialog>
<script src="assets/js/theme-community.js?v=v76-p4b"></script>
</body>
</html>
