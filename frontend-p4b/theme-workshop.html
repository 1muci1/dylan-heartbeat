<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090d"><title>心伴 · 美化工坊</title>
  <link rel="stylesheet" href="assets/css/common.css?v=v50-p4b">
  <link rel="stylesheet" href="assets/css/theme.css?v=v50-p4b">
  <link rel="stylesheet" href="assets/css/theme-workshop.css?v=v50-p4b">
  <script src="assets/js/theme-store.js?v=v50-p4b"></script>
  <script src="assets/js/common.js?v=v50-p4b"></script>
</head>
<body class="theme-workshop-page" data-page="settings">
<main class="app-shell theme-workshop-shell">
  <header class="theme-workshop-header"><a href="settings.html?returnTo=%2Ftheme-workshop.html#appearance" aria-label="返回设置">‹</a><div><p class="eyebrow">THEME STUDIO · V50</p><h1>美化工坊</h1></div></header>
  <section class="theme-panel theme-panel--presets"><h2>预设主题</h2><p>选择后先进入预览，点击应用才会保存。</p><div class="theme-presets" data-theme-presets></div></section>
  <section class="theme-panel theme-panel--editor"><h2>颜色与字体</h2><p>所有修改会立即出现在右侧小手机中。</p><div class="theme-grid">
    <label class="theme-field">主色<input type="color" data-theme-token="colorPrimary"></label>
    <label class="theme-field">强调色<input type="color" data-theme-token="colorAccent"></label>
    <label class="theme-field">页面背景<input type="color" data-theme-token="colorBg"></label>
    <label class="theme-field">文字色<input type="color" data-theme-token="colorText"></label>
    <label class="theme-field">用户气泡<input type="color" data-theme-token="chatUserBubbleBg"></label>
    <label class="theme-field">沉气泡<input type="color" data-theme-token="chatAssistantBubbleBg"></label>
    <label class="theme-field">卡片色<input type="color" data-theme-token="cardBg"></label>
    <label class="theme-field">底栏色<input type="color" data-theme-token="bottomNavBg"></label>
    <label class="theme-field">字体<select data-theme-token="fontFamily"><option value="system">系统默认</option><option value="rounded">圆体感</option><option value="serif">宋体感</option><option value="sans">黑体感</option><option value="custom">自定义</option></select></label>
    <label class="theme-field">自定义字体名<input type="text" maxlength="80" data-theme-custom-font placeholder="例如 LXGW WenKai"></label>
  </div></section>
  <section class="theme-panel theme-panel--editor"><h2>背景与玻璃</h2><p>只允许相对路径或 data:image；外部网址会被拒绝。</p><div class="theme-grid">
    <label class="theme-field theme-field--wide">背景资源<input type="text" data-theme-asset="backgroundImage" placeholder="/uploads/... 或 data:image/..."></label>
    <label class="theme-field theme-field--wide">选择本地背景图<input type="file" accept="image/png,image/jpeg,image/webp" data-theme-background-file><small>仅保存在当前浏览器主题中，最大 2 MB</small></label>
    <label class="theme-field">背景模糊<input type="range" min="0" max="30" value="18" data-theme-range="blur" data-unit="px"></label>
    <label class="theme-field">背景暗度<input type="range" min="0" max="80" value="18" data-theme-layout="backgroundDim" data-scale="100"></label>
    <label class="theme-field">玻璃强度<input type="range" min="0" max="100" value="72" data-theme-layout="glassIntensity" data-scale="100"></label>
  </div></section>
  <section class="theme-panel theme-panel--editor"><h2>气泡与底栏</h2><p>调整圆角、透明度、模糊、宽度与底栏高度。</p><div class="theme-grid">
    <label class="theme-field">气泡圆角<input type="range" min="8" max="40" data-theme-range="radiusBubble" data-unit="px"></label>
    <label class="theme-field">气泡透明度<input type="range" min="30" max="100" data-theme-layout="bubbleOpacity" data-scale="100"></label>
    <label class="theme-field">气泡模糊<input type="range" min="0" max="30" data-theme-layout="blurBubble" data-unit="px"></label>
    <label class="theme-field">最大宽度<input type="range" min="50" max="95" data-theme-layout="bubbleMaxWidth" data-unit="%"></label>
    <label class="theme-field">卡片圆角<input type="range" min="8" max="42" data-theme-range="radiusCard" data-unit="px"></label>
    <label class="theme-field">底栏高度<input type="range" min="60" max="120" data-theme-layout="bottomNavHeight" data-unit="px"></label>
    <label class="theme-field">底栏圆角<input type="range" min="0" max="40" data-theme-layout="radiusNav" data-unit="px"></label>
    <label class="theme-field">底栏透明度<input type="range" min="30" max="100" data-theme-layout="navOpacity" data-scale="100"></label>
    <label class="theme-field">底栏模糊<input type="range" min="0" max="36" data-theme-layout="blurNav" data-unit="px"></label>
    <label class="theme-field theme-field--wide">柔和阴影<input type="text" data-theme-token="shadowSoft" maxlength="120"></label>
    <label class="theme-field theme-field--wide">安全 customCss<textarea maxlength="8000" data-theme-custom-css placeholder="可选。禁止脚本、@import、外部 url 与全屏 fixed。"></textarea></label>
  </div></section>
  <section class="theme-panel theme-panel--preview"><h2>实时预览</h2><p data-theme-preview-name>当前草稿</p><div class="theme-phone" data-theme-preview><div class="theme-phone__screen"><div class="theme-phone__title">沉的小世界</div><div class="theme-phone__bubble theme-phone__bubble--user">陪我下棋</div><div class="theme-phone__bubble">好呀，我陪你。</div><div class="theme-phone__nav"></div></div></div></section>
  <section class="theme-panel theme-panel--actions"><h2>主题包</h2><p>第一版导入/导出 JSON；ZIP 主题资产包将在后续版本支持。</p><div class="theme-actions">
    <button type="button" data-theme-apply>应用主题</button><button type="button" data-theme-export>导出 JSON</button>
    <label>导入 JSON<input type="file" accept=".json,application/json" data-theme-import></label>
  </div><p class="theme-status" role="status" data-theme-status></p></section>
</main>
<script src="assets/js/theme-workshop.js?v=v50-p4b"></script>
</body></html>
